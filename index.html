<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Merry Christmas · 吴芷燕</title>
<style>
:root{
  --bg:#050505;
  --gold:#FFD700;
  --warm:#FFF2CC;
  --orange:#FF8C00;
  --sand:#C2B280;
  --sand-lit:#EFE4D1;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--bg);
}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  color:var(--warm);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
#gl,#fx2d,#snow{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  display:block;
}
#gl{z-index:1}
#fx2d{z-index:1;display:none}
#snow{z-index:2;pointer-events:none}

/* ---------- 顶部标题层 ---------- */
.hud{
  position:fixed;top:0;left:0;right:0;
  z-index:3;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;
}
.title{
  margin-top:clamp(22px,6.5vh,58px);
  font-family:"Segoe Script","Brush Script MT","Lucida Handwriting","Apple Chancery","Snell Roundhand",cursive;
  font-size:clamp(19px,4.4vw,38px);
  font-weight:400;
  line-height:1.25;
  color:var(--gold);
  letter-spacing:.045em;
  text-shadow:
    0 0 10px rgba(255,215,0,.78),
    0 0 26px rgba(255,140,0,.46),
    0 0 58px rgba(255,140,0,.22);
  animation:titleGlow 4.4s ease-in-out infinite;
}
@keyframes titleGlow{
  0%,100%{
    opacity:.9;
    text-shadow:0 0 9px rgba(255,215,0,.66),0 0 24px rgba(255,140,0,.38),0 0 52px rgba(255,140,0,.18);
  }
  50%{
    opacity:1;
    text-shadow:0 0 16px rgba(255,215,0,.96),0 0 40px rgba(255,140,0,.6),0 0 84px rgba(255,140,0,.3);
  }
}
.sub{
  margin-top:clamp(5px,1.2vh,12px);
  font-size:clamp(9px,2.1vw,12px);
  letter-spacing:.52em;
  text-indent:.52em;
  color:rgba(255,242,204,.52);
  text-shadow:0 0 12px rgba(255,215,0,.28);
}

/* ---------- 粒子文字对应的可读文字层 ---------- */
.msg{
  position:fixed;left:0;right:0;top:50%;
  transform:translateY(-50%);
  z-index:4;pointer-events:none;
  text-align:center;
  opacity:0;
  transition:opacity .85s cubic-bezier(.22,.61,.36,1);
}
.msg.on{opacity:1}
.msg .l1{
  font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC","Microsoft YaHei",serif;
  font-size:clamp(40px,15.5vw,300px);
  font-weight:700;
  line-height:1.16;
  letter-spacing:.06em;
  text-indent:.06em;
  color:rgba(255,248,231,.74);
  text-shadow:
    0 0 16px rgba(255,215,0,.9),
    0 0 44px rgba(255,140,0,.6),
    0 0 96px rgba(255,140,0,.32);
}
.msg .l2{
  margin-top:clamp(9px,2.2vh,20px);
  font-size:clamp(12px,3vw,19px);
  letter-spacing:.2em;
  text-indent:.2em;
  color:rgba(255,242,204,.92);
  text-shadow:0 0 12px rgba(255,215,0,.6),0 0 30px rgba(255,140,0,.34);
}

/* ---------- 控制按钮 ---------- */
.ctrl{
  position:fixed;
  right:clamp(13px,3vw,26px);
  bottom:clamp(15px,3.2vh,32px);
  z-index:6;
  display:flex;
  gap:9px;
}
.btn{
  -webkit-appearance:none;appearance:none;
  border:1px solid rgba(255,215,0,.55);
  background:rgba(255,215,0,.055);
  color:var(--gold);
  font-family:inherit;
  font-size:clamp(10px,2.3vw,12.5px);
  letter-spacing:.14em;
  text-indent:.14em;
  padding:9px 15px;
  border-radius:999px;
  cursor:pointer;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  box-shadow:0 0 0 rgba(255,215,0,0),inset 0 0 12px rgba(255,215,0,.07);
  transition:box-shadow .34s ease,background .34s ease,border-color .34s ease,transform .18s ease,color .34s ease;
}
.btn:hover,.btn:focus-visible{
  background:rgba(255,215,0,.14);
  border-color:rgba(255,215,0,.95);
  box-shadow:
    0 0 18px rgba(255,215,0,.55),
    0 0 44px rgba(255,140,0,.3),
    inset 0 0 18px rgba(255,215,0,.16);
  outline:none;
}
.btn:active{transform:scale(.955)}
.btn.off{
  color:rgba(255,242,204,.4);
  border-color:rgba(255,242,204,.2);
  background:rgba(255,242,204,.03);
  box-shadow:none;
}

/* ---------- 提示 ---------- */
.hint{
  position:fixed;left:0;right:0;
  bottom:clamp(62px,11.5vh,104px);
  z-index:5;pointer-events:none;
  text-align:center;
  font-size:clamp(9px,2.1vw,11.5px);
  letter-spacing:.3em;
  text-indent:.3em;
  color:rgba(255,242,204,.38);
  opacity:0;
  transition:opacity .8s ease;
}
.hint.on{opacity:1}

/* ---------- 降级提示 ---------- */
.note{
  position:fixed;left:0;right:0;
  bottom:clamp(96px,17vh,150px);
  z-index:5;pointer-events:none;
  text-align:center;
  font-size:clamp(9px,2vw,11px);
  letter-spacing:.16em;
  color:rgba(255,242,204,.3);
  opacity:0;
  transition:opacity .8s ease;
}
.note.on{opacity:1}

/* ---------- 无障碍：减少动态 ---------- */
@media (prefers-reduced-motion: reduce){
  .title{animation:none}
  .msg{transition:none}
  .btn{transition:none}
  .hint,.note{transition:none}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx2d"></canvas>
<canvas id="snow"></canvas>

<div class="hud">
  <h1 class="title">Merry Christmas</h1>
  <div class="sub">致 吴芷燕</div>
</div>

<div class="msg" id="msg">
  <div class="l1" id="msgL1">吴芷燕</div>
  <div class="l2" id="msgL2">圣诞快乐 · 愿你被温柔以待</div>
</div>

<div class="hint" id="hint">轻触屏幕 · 开启音乐</div>
<div class="note" id="note">当前环境已降级为 2D 渲染</div>

<div class="ctrl">
  <button class="btn off" id="musicBtn" type="button" aria-pressed="false">音乐 关</button>
  <button class="btn" id="snowBtn" type="button">撒雪</button>
</div>
<script>
(function(){
'use strict';

/* ============================================================
   0. 基础工具
   ============================================================ */
var byId = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var lerp = function(a,b,t){ return a+(b-a)*t; };
var easeOutCubic = function(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,3); };
var easeInOutCubic = function(t){
  t=clamp(t,0,1);
  return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
};
var easeOutQuint = function(t){ t=clamp(t,0,1); return 1-Math.pow(1-t,5); };

var REDUCED = false;
try{
  REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}catch(e){ REDUCED = false; }

var UA = navigator.userAgent || '';
var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(UA) ||
                Math.min(window.innerWidth, window.innerHeight) < 700;

/* ============================================================
   1. 全局配置
   ============================================================ */
var CFG = {
  N: IS_MOBILE ? 1500 : 3400,
  TEXT_RATIO: 0.72,
  TREE_BASE: -0.92,
  TREE_H: 1.78,
  TREE_R: 0.52,
  TREE_TURNS: 5.6
};

var cv     = byId('gl');
var cv2d   = byId('fx2d');
var snowCv = byId('snow');

var gl = null;
var GL_OK = false;

function dprCap(){
  var d = window.devicePixelRatio || 1;
  return IS_MOBILE ? Math.min(d, 1.5) : Math.min(d, 2);
}

/* ============================================================
   2. WebGL 初始化
   ============================================================ */
try{
  var glOpts = {
    alpha:false,
    antialias:false,
    depth:false,
    stencil:false,
    premultipliedAlpha:false,
    preserveDrawingBuffer:false,
    powerPreference:'high-performance'
  };
  gl = cv.getContext('webgl', glOpts) || cv.getContext('experimental-webgl', glOpts);
}catch(e){ gl = null; }
GL_OK = !!gl;

/* ---------- shader 源码 ---------- */
var VS_BG = [
  'attribute vec2 a_pos;',
  'varying vec2 v_uv;',
  'void main(){',
  '  v_uv = a_pos * 0.5 + 0.5;',
  '  gl_Position = vec4(a_pos, 0.0, 1.0);',
  '}'
].join('\n');

var FS_BG = [
  'precision highp float;',
  'varying vec2 v_uv;',
  'uniform vec2  u_res;',
  'uniform float u_time;',
  'uniform float u_aspect;',
  'uniform float u_burst;',
  'uniform float u_horizon;',
  '',
  'float hash(vec2 p){',
  '  p = fract(p * vec2(123.34, 456.21));',
  '  p += dot(p, p + 45.32);',
  '  return fract(p.x * p.y);',
  '}',
  '',
  'void main(){',
  '  vec2 uv = v_uv;',
  '  float ndcX = uv.x * 2.0 - 1.0;',
  '  float ndcY = uv.y * 2.0 - 1.0;',
  '',
  '  vec3 col = vec3(0.0196, 0.0196, 0.0196);',
  '',
  '  float dc = length(vec2(ndcX, ndcY * u_aspect));',
  '  col += vec3(0.030, 0.022, 0.012) * (1.0 - smoothstep(0.0, 1.55, dc));',
  '',
  '  vec2 g  = uv * u_res / 3.2;',
  '  vec2 gi = floor(g);',
  '  vec2 gf = fract(g);',
  '  float h = hash(gi);',
  '  if(h > 0.982){',
  '    vec2 sp = vec2(hash(gi + 1.37), hash(gi + 7.71));',
  '    float dist = length(gf - sp);',
  '    float tw = 0.5 + 0.5 * sin(u_time * (1.1 + h * 2.6) + h * 41.0);',
  '    float star = smoothstep(0.10, 0.0, dist) * tw;',
  '    col += vec3(1.0, 0.98, 0.94) * star * 0.9;',
  '  }',
  '',
  '  float arcY = -0.30 - 0.62 * ndcX * ndcX;',
  '  float inG  = smoothstep(0.012, -0.012, ndcY - arcY);',
  '  float depth = clamp((arcY - ndcY) / 0.75, 0.0, 1.0);',
  '  vec3 sand = mix(vec3(0.760, 0.700, 0.502), vec3(0.105, 0.082, 0.058), depth);',
  '  col = mix(col, sand, inG);',
  '',
  '  float rim = smoothstep(0.055, 0.0, abs(ndcY - arcY));',
  '  col += vec3(0.937, 0.894, 0.820) * rim * 0.62 * u_horizon;',
  '',
  '  float gd = length(vec2(ndcX, ndcY - 0.66));',
  '  float pulse = 0.62 + 0.38 * sin(u_time * 1.75);',
  '  col += vec3(1.0, 0.72, 0.26) * exp(-gd * 3.4) * 0.52 * pulse;',
  '  col += vec3(1.0, 0.95, 0.86) * exp(-gd * 7.0) * u_burst * 1.7;',
  '',
  '  float vig = 1.0 - 0.55 * smoothstep(0.55, 1.55, length(vec2(ndcX, ndcY)));',
  '  col *= vig;',
  '',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

var VS_PT = [
  'attribute vec2  a_pos;',
  'attribute vec3  a_col;',
  'attribute float a_size;',
  'attribute float a_alpha;',
  'uniform float u_dpr;',
  'varying vec3  v_col;',
  'varying float v_alpha;',
  'void main(){',
  '  gl_Position  = vec4(a_pos, 0.0, 1.0);',
  '  gl_PointSize = a_size * u_dpr;',
  '  v_col   = a_col;',
  '  v_alpha = a_alpha;',
  '}'
].join('\n');

var FS_PT = [
  'precision mediump float;',
  'varying vec3  v_col;',
  'varying float v_alpha;',
  'void main(){',
  '  vec2 d = gl_PointCoord - vec2(0.5);',
  '  float r = length(d);',
  '  float a = smoothstep(0.5, 0.0, r);',
  '  a = pow(a, 1.7);',
  '  vec3 c = v_col * (0.55 + 0.85 * a);',
  '  gl_FragColor = vec4(c, a * v_alpha);',
  '}'
].join('\n');

/* ---------- program 构建 ---------- */
var bgProg = null, ptProg = null;
var bgLoc = {}, ptLoc = {};
var quadVBO = null, ptVBO = null;

function compileShader(type, src){
  var sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    var log = gl.getShaderInfoLog(sh);
    gl.deleteShader(sh);
    throw new Error('shader compile failed: ' + log);
  }
  return sh;
}

function buildProgram(vsSrc, fsSrc){
  var vs = compileShader(gl.VERTEX_SHADER, vsSrc);
  var fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
  var p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    var log = gl.getProgramInfoLog(p);
    gl.deleteProgram(p);
    throw new Error('program link failed: ' + log);
  }
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  return p;
}

function initGL(){
  bgProg = buildProgram(VS_BG, FS_BG);
  bgLoc.a_pos     = gl.getAttribLocation(bgProg, 'a_pos');
  bgLoc.u_res     = gl.getUniformLocation(bgProg, 'u_res');
  bgLoc.u_time    = gl.getUniformLocation(bgProg, 'u_time');
  bgLoc.u_aspect  = gl.getUniformLocation(bgProg, 'u_aspect');
  bgLoc.u_burst   = gl.getUniformLocation(bgProg, 'u_burst');
  bgLoc.u_horizon = gl.getUniformLocation(bgProg, 'u_horizon');

  ptProg = buildProgram(VS_PT, FS_PT);
  ptLoc.a_pos   = gl.getAttribLocation(ptProg, 'a_pos');
  ptLoc.a_col   = gl.getAttribLocation(ptProg, 'a_col');
  ptLoc.a_size  = gl.getAttribLocation(ptProg, 'a_size');
  ptLoc.a_alpha = gl.getAttribLocation(ptProg, 'a_alpha');
  ptLoc.u_dpr   = gl.getUniformLocation(ptProg, 'u_dpr');

  quadVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1,-1,  3,-1,  -1,3
  ]), gl.STATIC_DRAW);

  ptVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ptVBO);
  gl.bufferData(gl.ARRAY_BUFFER, (CFG.N * 7) * 4, gl.DYNAMIC_DRAW);

  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.clearColor(0.0196, 0.0196, 0.0196, 1.0);
}
/* ============================================================
   3. 粒子系统
   ============================================================ */
var N = CFG.N;
var N_TEXT = Math.floor(N * CFG.TEXT_RATIO);

var P = {
  t:    new Float32Array(N),
  ang0: new Float32Array(N),
  rj:   new Float32Array(N),
  spin: new Float32Array(N),
  sz:   new Float32Array(N),
  al:   new Float32Array(N),
  tx:   new Float32Array(N),
  ty:   new Float32Array(N),
  cx:   new Float32Array(N),
  cy:   new Float32Array(N)
};

var posBuf   = new Float32Array(N * 2);
var colBuf   = new Float32Array(N * 3);
var sizeBuf  = new Float32Array(N);
var alphaBuf = new Float32Array(N);

/* 金色渐变：#FF8C00 -> #FFD700 -> #FFF2CC */
var C_ORANGE = [1.0, 0.549, 0.0];
var C_GOLD   = [1.0, 0.843, 0.0];
var C_WARM   = [1.0, 0.949, 0.8];

function goldColor(t){
  t = clamp(t, 0, 1);
  var a, b, k;
  if(t < 0.55){
    a = C_ORANGE; b = C_GOLD; k = t / 0.55;
  }else{
    a = C_GOLD; b = C_WARM; k = (t - 0.55) / 0.45;
  }
  return [
    lerp(a[0], b[0], k),
    lerp(a[1], b[1], k),
    lerp(a[2], b[2], k)
  ];
}

function initParticles(){
  for(var i = 0; i < N; i++){
    /* 底部更密，形成树冠层次 */
    var t = Math.pow(Math.random(), 0.86);
    P.t[i]    = t;
    P.ang0[i] = Math.random() * Math.PI * 2;
    P.rj[i]   = 0.80 + Math.random() * 0.40;
    P.spin[i] = 0.55 + Math.random() * 0.95;
    P.sz[i]   = (IS_MOBILE ? 1.7 : 2.1) + Math.random() * 2.3;
    P.al[i]   = 0.42 + Math.random() * 0.58;

    var c = goldColor(t);
    colBuf[i * 3]     = c[0];
    colBuf[i * 3 + 1] = c[1];
    colBuf[i * 3 + 2] = c[2];

    P.cx[i] = 0;
    P.cy[i] = -1.2;
  }
}

/* ============================================================
   4. 文字采样（Canvas 绘制 -> 像素采样 -> 粒子目标点）
   ============================================================ */
var TEXT_SETS = {};
var curTextKey = null;

function sampleText(text, fontSize, fontFamily, step){
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');
  if(!ctx) return null;

  var font = 'bold ' + fontSize + 'px ' + fontFamily;
  ctx.font = font;
  var m = ctx.measureText(text);
  var pad = Math.ceil(fontSize * 0.22);
  var w = Math.max(2, Math.ceil(m.width) + pad * 2);
  var h = Math.max(2, Math.ceil(fontSize * 1.42) + pad * 2);

  /* 限制画布尺寸，避免超大内存 */
  var MAXW = 1400;
  if(w > MAXW){
    var sc = MAXW / w;
    w = MAXW;
    h = Math.max(2, Math.round(h * sc));
    fontSize = Math.round(fontSize * sc);
    font = 'bold ' + fontSize + 'px ' + fontFamily;
  }

  c.width = w;
  c.height = h;

  var ctx2 = c.getContext('2d');
  ctx2.clearRect(0, 0, w, h);
  ctx2.font = font;
  ctx2.fillStyle = '#ffffff';
  ctx2.textAlign = 'center';
  ctx2.textBaseline = 'middle';
  ctx2.fillText(text, w / 2, h / 2);

  var data;
  try{
    data = ctx2.getImageData(0, 0, w, h).data;
  }catch(e){
    return null;
  }

  var pts = [];
  for(var y = 0; y < h; y += step){
    for(var x = 0; x < w; x += step){
      if(data[(y * w + x) * 4 + 3] > 128){
        pts.push([x / w - 0.5, -(y / h - 0.5)]);
      }
    }
  }
  if(!pts.length) return null;
  return { pts: pts, w: w, h: h };
}

/* 归一化点 -> NDC 目标点（保持文字不变形） */
function mapPts(s, ndcW, aspect, yOffset){
  var ndcH = ndcW * aspect * (s.h / s.w);
  var n = s.pts.length;
  var out = new Float32Array(n * 2);
  for(var i = 0; i < n; i++){
    out[i * 2]     = s.pts[i][0] * ndcW;
    out[i * 2 + 1] = s.pts[i][1] * ndcH + (yOffset || 0);
  }
  return out;
}

var FONT_CN = '"STKaiti","KaiTi","Kaiti SC","Songti SC","Microsoft YaHei",serif';
var FONT_NUM = '"Helvetica Neue","Arial","Microsoft YaHei",sans-serif';

function buildTextSets(){
  var aspect = (cv.clientWidth || window.innerWidth) / (cv.clientHeight || window.innerHeight);
  if(!isFinite(aspect) || aspect <= 0) aspect = 1;

  var step = IS_MOBILE ? 4 : 3;
  var fs = IS_MOBILE ? 150 : 200;

  TEXT_SETS = {};

  /* 倒计时数字 */
  var nums = ['3', '2', '1'];
  for(var i = 0; i < nums.length; i++){
    var sn = sampleText(nums[i], fs * 1.35, FONT_NUM, step + 1);
    if(sn) TEXT_SETS['num' + i] = mapPts(sn, 0.42, aspect, 0.02);
  }

  /* 姓名 */
  var sName = sampleText('吴芷燕', fs, FONT_CN, step);
  if(sName) TEXT_SETS['name'] = mapPts(sName, 1.24, aspect, 0.02);

  /* 祝福主文案 */
  var sWish = sampleText('圣诞快乐', fs, FONT_CN, step);
  if(sWish) TEXT_SETS['wish'] = mapPts(sWish, 1.24, aspect, 0.02);
}

function applyTextSet(key){
  var arr = TEXT_SETS[key];
  if(!arr) return;
  var m = arr.length / 2;
  if(m < 1) return;
  for(var i = 0; i < N; i++){
    var j = (Math.random() * m) | 0;
    P.tx[i] = arr[j * 2];
    P.ty[i] = arr[j * 2 + 1];
  }
}

/* ============================================================
   5. 时间轴
   ============================================================ */
var TL = [
  ['grow',    3.0],
  ['count',   3.0],
  ['name',    3.5],
  ['wish',    4.5],
  ['nebula',  3.0],
  ['rebirth', 4.0],
  ['hold',    7.0]
];
var TOTAL = 0;
for(var ti = 0; ti < TL.length; ti++) TOTAL += TL[ti][1];

var ST = {
  phase: 'grow',
  pp: 0,
  grow: 1,
  treeW: 1,
  textW: 0,
  nebW: 0,
  burst: 0,
  textKey: null,
  horizon: 1
};

function updateTimeline(time){
  var tt = time % TOTAL;
  var acc = 0, phase = 'hold', pp = 0;
  for(var i = 0; i < TL.length; i++){
    var d = TL[i][1];
    if(tt < acc + d){
      phase = TL[i][0];
      pp = (tt - acc) / d;
      break;
    }
    acc += d;
  }
  pp = clamp(pp, 0, 1);

  ST.phase = phase;
  ST.pp = pp;
  ST.textKey = null;
  ST.horizon = 1;

  var grow = 1, treeW = 1, textW = 0, nebW = 0, burst = 0;

  if(phase === 'grow'){
    grow = easeOutCubic(pp);
    treeW = 1;
  }
  else if(phase === 'count'){
    grow = 1;
    var idx = Math.min(2, Math.floor(pp * 3));
    var sub = (pp * 3) % 1;
    var w = Math.sin(clamp(sub, 0, 1) * Math.PI);
    textW = w * 0.92;
    treeW = 1 - textW;
    ST.textKey = 'num' + idx;
  }
  else if(phase === 'name'){
    grow = 1;
    var k1 = easeInOutCubic(clamp(pp / 0.30, 0, 1));
    var k2 = 1 - easeInOutCubic(clamp((pp - 0.86) / 0.14, 0, 1));
    textW = k1 * k2;
    treeW = 1 - textW;
    ST.textKey = 'name';
  }
  else if(phase === 'wish'){
    grow = 1;
    var k3 = easeInOutCubic(clamp(pp / 0.22, 0, 1));
    var k4 = 1 - easeInOutCubic(clamp((pp - 0.88) / 0.12, 0, 1));
    textW = k3 * k4;
    treeW = 1 - textW;
    ST.textKey = 'wish';
  }
  else if(phase === 'nebula'){
    var k5 = easeInOutCubic(pp);
    nebW = k5;
    treeW = 1 - k5;
    grow = 1;
  }
  else if(phase === 'rebirth'){
    var k6 = easeInOutCubic(pp);
    nebW = 1 - k6;
    treeW = k6;
    grow = easeOutCubic(clamp(pp * 1.18, 0, 1));
    burst = Math.pow(clamp((pp - 0.52) / 0.48, 0, 1), 1.6);
  }
  else{
    treeW = 1;
    grow = 1;
    burst = 0.55 + 0.45 * Math.sin(time * 1.35);
  }

  ST.grow = grow;
  ST.treeW = treeW;
  ST.textW = textW;
  ST.nebW = nebW;
  ST.burst = burst;

  /* 文字目标点切换 */
  if(ST.textKey !== curTextKey){
    curTextKey = ST.textKey;
    if(curTextKey && TEXT_SETS[curTextKey]) applyTextSet(curTextKey);
  }
}
/* ============================================================
   6. 粒子更新 + 渲染
   ============================================================ */
var ptData = new Float32Array(N * 7);
var STRIDE = 7 * 4;

function updateParticles(time){
  var W = cv.clientWidth || window.innerWidth;
  var H = cv.clientHeight || window.innerHeight;
  var aspect = W / H;
  if(!isFinite(aspect) || aspect <= 0) aspect = 1;
  var xScale = clamp(aspect, 0.72, 1.0);

  var flow = time * 0.42;
  var breathe = 0.78 + 0.22 * Math.sin(time * 1.7);
  var grow = ST.grow;
  var textW = ST.textW, nebW = ST.nebW;

  var BASE = CFG.TREE_BASE;
  var HGT  = CFG.TREE_H;
  var RMAX = CFG.TREE_R;

  for(var i = 0; i < N; i++){
    var t = P.t[i];
    var ang = P.ang0[i] + flow * P.spin[i];
    var rad = (1 - t) * RMAX * P.rj[i];
    var wx = Math.cos(ang) * rad * xScale;
    var wy = BASE + t * HGT * grow;
    var wz = Math.sin(ang) * rad;
    var persp = 1 / (1 + wz * 0.55);

    var tx = wx * persp;
    var ty = wy;
    var tsz = P.sz[i] * persp;
    var tal = P.al[i] * (0.55 + 0.45 * persp) * breathe;

    var x = tx, y = ty, sz = tsz, al = tal;

    /* 文字聚合 */
    if(textW > 0.001 && i < N_TEXT){
      x = tx * (1 - textW) + P.tx[i] * textW;
      y = ty * (1 - textW) + P.ty[i] * textW;
      sz = tsz * (1 - textW) + (P.sz[i] * 1.05) * textW;
      al = tal * (1 - textW) + 0.92 * textW;
    }

    /* 星云扩散 */
    if(nebW > 0.001){
      var sc = 1 + nebW * 2.4;
      var nx = tx * sc + Math.cos(ang * 2.3 + time * 0.9) * 0.30 * nebW;
      var ny = ty * sc + Math.sin(ang * 3.1 + time * 0.7) * 0.36 * nebW;
      x = x * (1 - nebW) + nx * nebW;
      y = y * (1 - nebW) + ny * nebW;
      al = al * (1 - nebW * 0.35);
    }

    var o = i * 7;
    ptData[o]     = x;
    ptData[o + 1] = y;
    ptData[o + 2] = colBuf[i * 3];
    ptData[o + 3] = colBuf[i * 3 + 1];
    ptData[o + 4] = colBuf[i * 3 + 2];
    ptData[o + 5] = sz;
    ptData[o + 6] = clamp(al, 0, 1);
  }
}

function drawGL(time){
  var W = cv.width, H = cv.height;
  if(!W || !H) return;

  gl.viewport(0, 0, W, H);
  gl.clear(gl.COLOR_BUFFER_BIT);

  /* --- 背景 --- */
  gl.useProgram(bgProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
  gl.enableVertexAttribArray(bgLoc.a_pos);
  gl.vertexAttribPointer(bgLoc.a_pos, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(bgLoc.u_res, W, H);
  gl.uniform1f(bgLoc.u_time, time);
  gl.uniform1f(bgLoc.u_aspect, H / W);
  gl.uniform1f(bgLoc.u_burst, ST.burst);
  gl.uniform1f(bgLoc.u_horizon, 1.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* --- 粒子 --- */
  gl.useProgram(ptProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, ptVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, ptData);

  gl.enableVertexAttribArray(ptLoc.a_pos);
  gl.vertexAttribPointer(ptLoc.a_pos, 2, gl.FLOAT, false, STRIDE, 0);
  gl.enableVertexAttribArray(ptLoc.a_col);
  gl.vertexAttribPointer(ptLoc.a_col, 3, gl.FLOAT, false, STRIDE, 8);
  gl.enableVertexAttribArray(ptLoc.a_size);
  gl.vertexAttribPointer(ptLoc.a_size, 1, gl.FLOAT, false, STRIDE, 20);
  gl.enableVertexAttribArray(ptLoc.a_alpha);
  gl.vertexAttribPointer(ptLoc.a_alpha, 1, gl.FLOAT, false, STRIDE, 24);

  gl.uniform1f(ptLoc.u_dpr, dprCap());
  gl.drawArrays(gl.POINTS, 0, N);
}

/* ============================================================
   7. Canvas2D 降级
   ============================================================ */
var ctx2d = null;
var D2 = { w: 0, h: 0, dpr: 1 };

function init2D(){
  cv2d.style.display = 'block';
  cv.style.display = 'none';
  ctx2d = cv2d.getContext('2d');
  if(!ctx2d) return;
  resize2D();
}

function resize2D(){
  if(!ctx2d) return;
  var dpr = dprCap();
  var w = window.innerWidth, h = window.innerHeight;
  D2.dpr = dpr;
  D2.w = w;
  D2.h = h;
  cv2d.width  = Math.round(w * dpr);
  cv2d.height = Math.round(h * dpr);
  cv2d.style.width  = w + 'px';
  cv2d.style.height = h + 'px';
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw2D(time){
  if(!ctx2d) return;
  var w = D2.w, h = D2.h;
  var cx = w / 2, cy = h / 2;
  var unit = h / 2;

  ctx2d.clearRect(0, 0, w, h);

  /* 深空底色 */
  var bgGrad = ctx2d.createRadialGradient(cx, cy * 0.72, 0, cx, cy, Math.max(w, h) * 0.78);
  bgGrad.addColorStop(0, '#0A0708');
  bgGrad.addColorStop(0.55, '#070506');
  bgGrad.addColorStop(1, '#050505');
  ctx2d.fillStyle = bgGrad;
  ctx2d.fillRect(0, 0, w, h);

  /* 星点 */
  var seed = 20251225;
  function rnd(){
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  }
  var starN = IS_MOBILE ? 110 : 200;
  for(var s = 0; s < starN; s++){
    var sx = rnd() * w;
    var sy = rnd() * h * 0.92;
    var sr = 0.4 + rnd() * 1.15;
    var tw = 0.55 + 0.45 * Math.sin(time * (0.9 + rnd() * 2.2) + s);
    ctx2d.beginPath();
    ctx2d.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx2d.fillStyle = 'rgba(255,250,240,' + (0.35 + tw * 0.55).toFixed(3) + ')';
    ctx2d.fill();
  }

  /* 弧形地平线 */
  var arcBase = cy + 0.30 * unit;
  var arcK = 0.62 * unit;
  ctx2d.beginPath();
  ctx2d.moveTo(0, h);
  for(var px = 0; px <= w; px += 4){
    var nx = (px - cx) / (w / 2);
    var ay = arcBase + arcK * nx * nx;
    ctx2d.lineTo(px, ay);
  }
  ctx2d.lineTo(w, h);
  ctx2d.closePath();

  var gGrad = ctx2d.createLinearGradient(0, arcBase, 0, h);
  gGrad.addColorStop(0, '#C2B280');
  gGrad.addColorStop(0.35, '#8A7A55');
  gGrad.addColorStop(1, '#1A1510');
  ctx2d.fillStyle = gGrad;
  ctx2d.fill();

  /* 地平线亮边 */
  ctx2d.beginPath();
  for(var px2 = 0; px2 <= w; px2 += 4){
    var nx2 = (px2 - cx) / (w / 2);
    var ay2 = arcBase + arcK * nx2 * nx2;
    if(px2 === 0) ctx2d.moveTo(px2, ay2);
    else ctx2d.lineTo(px2, ay2);
  }
  ctx2d.strokeStyle = 'rgba(239,228,209,0.85)';
  ctx2d.lineWidth = 1.6;
  ctx2d.shadowColor = 'rgba(239,228,209,0.9)';
  ctx2d.shadowBlur = 14;
  ctx2d.stroke();
  ctx2d.shadowBlur = 0;

  /* 粒子树 */
  var flow = time * 0.42;
  var breathe = 0.78 + 0.22 * Math.sin(time * 1.7);
  var grow = ST.grow;
  var BASE = CFG.TREE_BASE, HGT = CFG.TREE_H, RMAX = CFG.TREE_R;
  var xScale = clamp(w / h, 0.72, 1.0);

  ctx2d.globalCompositeOperation = 'lighter';

  var step = IS_MOBILE ? 2 : 1;
  for(var i = 0; i < N; i += step){
    var t = P.t[i];
    var ang = P.ang0[i] + flow * P.spin[i];
    var rad = (1 - t) * RMAX * P.rj[i];
    var wx = Math.cos(ang) * rad * xScale;
    var wy = BASE + t * HGT * grow;
    var wz = Math.sin(ang) * rad;
    var persp = 1 / (1 + wz * 0.55);

    var px3 = cx + wx * persp * unit;
    var py3 = cy - wy * unit;
    var r3 = Math.max(0.6, P.sz[i] * persp * 0.62);
    var a3 = clamp(P.al[i] * (0.55 + 0.45 * persp) * breathe, 0, 1);

    var c = goldColor(t);
    ctx2d.beginPath();
    ctx2d.arc(px3, py3, r3, 0, Math.PI * 2);
    ctx2d.fillStyle = 'rgba(' +
      Math.round(c[0] * 255) + ',' +
      Math.round(c[1] * 255) + ',' +
      Math.round(c[2] * 255) + ',' +
      a3.toFixed(3) + ')';
    ctx2d.fill();
  }

  /* 树顶泛光 */
  var topY = cy - (BASE + HGT * grow) * unit;
  var pulse = 0.62 + 0.38 * Math.sin(time * 1.75);
  var glowR = unit * (0.30 + 0.06 * pulse);
  var glow = ctx2d.createRadialGradient(cx, topY, 0, cx, topY, glowR);
  glow.addColorStop(0, 'rgba(255,215,0,' + (0.55 * pulse).toFixed(3) + ')');
  glow.addColorStop(0.45, 'rgba(255,140,0,' + (0.22 * pulse).toFixed(3) + ')');
  glow.addColorStop(1, 'rgba(255,140,0,0)');
  ctx2d.fillStyle = glow;
  ctx2d.beginPath();
  ctx2d.arc(cx, topY, glowR, 0, Math.PI * 2);
  ctx2d.fill();

  /* 爆发高光 */
  if(ST.burst > 0.01){
    var bR = unit * (0.22 + 0.42 * ST.burst);
    var bg2 = ctx2d.createRadialGradient(cx, topY, 0, cx, topY, bR);
    bg2.addColorStop(0, 'rgba(255,255,250,' + (0.85 * ST.burst).toFixed(3) + ')');
    bg2.addColorStop(0.35, 'rgba(255,242,204,' + (0.42 * ST.burst).toFixed(3) + ')');
    bg2.addColorStop(1, 'rgba(255,242,204,0)');
    ctx2d.fillStyle = bg2;
    ctx2d.beginPath();
    ctx2d.arc(cx, topY, bR, 0, Math.PI * 2);
    ctx2d.fill();
  }

  ctx2d.globalCompositeOperation = 'source-over';
}
/* ============================================================
   8. 音乐（WebAudio 程序化合成《铃儿响叮当》）
   ============================================================ */
var actx = null, masterGain = null;
var musicPlaying = false, musicTimer = null;

var NOTE = {
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
  G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99
};

var MELODY = [
  ['E4', 1], ['E4', 1], ['E4', 2],
  ['E4', 1], ['E4', 1], ['E4', 2],
  ['E4', 1], ['G4', 1], ['C4', 1.5], ['D4', 0.5], ['E4', 4],
  ['F4', 1], ['F4', 1], ['F4', 1.5], ['F4', 0.5],
  ['F4', 1], ['E4', 1], ['E4', 1], ['E4', 0.5], ['E4', 0.5],
  ['E4', 1], ['D4', 1], ['D4', 1], ['E4', 1],
  ['D4', 2], ['G4', 2]
];

function ensureAudio(){
  if(!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{
      actx = new AC();
    }catch(e){
      return null;
    }
    masterGain = actx.createGain();
    masterGain.gain.value = 0.16;
    masterGain.connect(actx.destination);
  }
  if(actx.state === 'suspended'){
    try{ actx.resume(); }catch(e){}
  }
  return actx;
}

function playNote(freq, start, dur, vol){
  if(!actx || !masterGain) return;
  var o = actx.createOscillator();
  var g = actx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.016);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur * 0.9);
  o.connect(g);
  g.connect(masterGain);
  o.start(start);
  o.stop(start + dur + 0.02);
}

function scheduleRound(){
  if(!musicPlaying || !actx) return;
  var BPM = 132;
  var beat = 60 / BPM;
  var t0 = actx.currentTime + 0.09;
  var acc = 0;
  for(var i = 0; i < MELODY.length; i++){
    var n = MELODY[i];
    var f = NOTE[n[0]];
    var d = n[1] * beat;
    if(f) playNote(f, t0 + acc, d, 0.22);
    acc += d;
  }
  musicTimer = setTimeout(scheduleRound, acc * 1000 + 420);
}

function musicOn(){
  if(!ensureAudio()) return;
  musicPlaying = true;
  if(masterGain && actx){
    try{
      masterGain.gain.cancelScheduledValues(actx.currentTime);
      masterGain.gain.setValueAtTime(0.16, actx.currentTime);
    }catch(e){}
  }
  var mb = byId('musicBtn');
  if(mb){
    mb.textContent = '音乐 开';
    mb.classList.remove('off');
    mb.setAttribute('aria-pressed', 'true');
  }
  scheduleRound();
}

function musicOff(){
  musicPlaying = false;
  if(musicTimer){ clearTimeout(musicTimer); musicTimer = null; }
  if(masterGain && actx){
    try{
      masterGain.gain.cancelScheduledValues(actx.currentTime);
      masterGain.gain.setTargetAtTime(0.0001, actx.currentTime, 0.06);
    }catch(e){}
  }
  var mb = byId('musicBtn');
  if(mb){
    mb.textContent = '音乐 关';
    mb.classList.add('off');
    mb.setAttribute('aria-pressed', 'false');
  }
}

function toggleMusic(){
  if(musicPlaying) musicOff();
  else musicOn();
}

   9. 撒雪彩蛋（金色描边辉光粒子）
   ============================================================ */
var flakes = [];
var snowRAF = null;
var snowCtx = null;

function snowBurst(){
  if(!snowCtx) snowCtx = snowCv.getContext('2d');
  if(!snowCtx) return;

  var dpr = dprCap();
  var w = snowCv.width, h = snowCv.height;
  var count = IS_MOBILE ? 70 : 130;

  for(var i = 0; i < count; i++){
    flakes.push({
      x: Math.random() * w,
      y: -Math.random() * h * 0.4,
      vx: (Math.random() - 0.5) * 0.55 * dpr,
      vy: (0.9 + Math.random() * 2.1) * dpr,
      r: (0.9 + Math.random() * 2.2) * dpr,
      a: 0.45 + Math.random() * 0.55,
      gold: Math.random() < 0.72,
      sw: Math.random() * Math.PI * 2,
      sws: 0.6 + Math.random() * 1.4
    });
  }
  if(!snowRAF) snowRAF = requestAnimationFrame(snowLoop);
}

function snowLoop(now){
  if(!snowCtx) snowCtx = snowCv.getContext('2d');
  if(!snowCtx) return;

  var w = snowCv.width, h = snowCv.height;
  snowCtx.clearRect(0, 0, w, h);

  for(var i = flakes.length - 1; i >= 0; i--){
    var f = flakes[i];
    f.sw += 0.022 * f.sws;
    f.x += f.vx + Math.sin(f.sw) * 0.65;
    f.y += f.vy;

    if(f.y > h + 24 || f.x < -40 || f.x > w + 40){
      flakes.splice(i, 1);
      continue;
    }

    snowCtx.beginPath();
    snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    if(f.gold){
      snowCtx.fillStyle = 'rgba(255,215,0,' + f.a.toFixed(3) + ')';
      snowCtx.shadowColor = 'rgba(255,215,0,0.9)';
      snowCtx.shadowBlur = 9;
    }else{
      snowCtx.fillStyle = 'rgba(255,248,235,' + f.a.toFixed(3) + ')';
      snowCtx.shadowColor = 'rgba(255,248,235,0.8)';
      snowCtx.shadowBlur = 7;
    }
    snowCtx.fill();
  }

  snowCtx.shadowBlur = 0;

  if(flakes.length > 0){
    snowRAF = requestAnimationFrame(snowLoop);
  }else{
    snowRAF = null;
    snowCtx.clearRect(0, 0, w, h);
  }
}

var t0 = 0;
var rafId = null;
var msgState = '';

/* 支持 ?t=秒 从指定时间点开始（便于静态预览/截图） */
var START_T = 0;
try{
  var _m = /[?&]t=([\d.]+)/.exec(location.search);
  if(_m) START_T = Math.max(0, parseFloat(_m[1]) || 0);
}catch(e){ START_T = 0; }

function updateMsg(){
  var want = '';
  if(ST.phase === 'name' && ST.textW > 0.55) want = 'name';
  else if(ST.phase === 'wish' && ST.textW > 0.55) want = 'wish';

  if(want === msgState) return;
  msgState = want;

  var msg = byId('msg');
  var l1 = byId('msgL1');
  var l2 = byId('msgL2');
  if(!msg || !l1 || !l2) return;

  if(want === 'name'){
    l1.textContent = '吴芷燕';
    l2.textContent = '圣诞快乐 · 愿你被温柔以待';
    msg.classList.add('on');
  }else if(want === 'wish'){
    l1.textContent = '圣诞快乐';
    l2.textContent = '愿你被温柔以待 · 岁岁平安';
    msg.classList.add('on');
  }else{
    msg.classList.remove('on');
  }
}

function loop(now){
  if(!t0) t0 = now;
  var time = START_T > 0 ? START_T : (now - t0) / 1000;

  if(REDUCED){
    ST.phase = 'hold';
    ST.grow = 1;
    ST.treeW = 1;
    ST.textW = 0;
    ST.nebW = 0;
    ST.burst = 0.6;
    time = 6.0;
  }else{
    updateTimeline(time);
    updateMsg();
  }

  if(GL_OK){
    updateParticles(time);
    drawGL(time);
  }else{
    draw2D(time);
  }

  rafId = requestAnimationFrame(loop);
}

function resizeAll(){
  var dpr = dprCap();
  var w = window.innerWidth;
  var h = window.innerHeight;

  if(GL_OK){
    cv.width  = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width  = w + 'px';
    cv.style.height = h + 'px';
  }
  if(ctx2d) resize2D();

  snowCv.width  = Math.round(w * dpr);
  snowCv.height = Math.round(h * dpr);
  snowCv.style.width  = w + 'px';
  snowCv.style.height = h + 'px';

  buildTextSets();
  if(curTextKey && TEXT_SETS[curTextKey]) applyTextSet(curTextKey);
}

function bindButtons(){
  var mb = byId('musicBtn');
  var sb = byId('snowBtn');
  var hint = byId('hint');

  if(mb){
    mb.addEventListener('click', function(e){
      e.stopPropagation();
      toggleMusic();
    });
  }

  if(sb){
    sb.addEventListener('click', function(e){
      e.stopPropagation();
      snowBurst();
    });
  }

  function firstTouch(e){
    var tgt = e.target;
    if(tgt && tgt.closest && tgt.closest('.btn')) return;
    if(hint) hint.classList.remove('on');
    document.removeEventListener('pointerdown', firstTouch);
    if(!musicPlaying) musicOn();
  }
  document.addEventListener('pointerdown', firstTouch);
}

function boot(){
  initParticles();
  buildTextSets();

  if(GL_OK){
    try{
      initGL();
    }catch(err){
      GL_OK = false;
      gl = null;
    }
  }

  if(!GL_OK){
    init2D();
    var note = byId('note');
    if(note) note.classList.add('on');
  }

  resizeAll();
  bindButtons();

  var hint = byId('hint');
  if(hint && !REDUCED) hint.classList.add('on');

  if(REDUCED){
    var msg = byId('msg');
    var l1 = byId('msgL1');
    var l2 = byId('msgL2');
    if(l1) l1.textContent = '吴芷燕';
    if(l2) l2.textContent = '圣诞快乐 · 愿你被温柔以待';
    if(msg) msg.classList.add('on');
  }

  window.addEventListener('resize', resizeAll);
  window.addEventListener('orientationchange', function(){
    setTimeout(resizeAll, 260);
  });

  rafId = requestAnimationFrame(loop);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}

})();
</script>
</body>
</html>
